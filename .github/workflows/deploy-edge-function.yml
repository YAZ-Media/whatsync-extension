name: Deploy hubspot edge function

# Deploys the Supabase edge function automatically whenever its source changes
# on main, then smoke-tests the live endpoint. Requires one repository secret:
#   SUPABASE_ACCESS_TOKEN  (Supabase Dashboard → Account → Access Tokens)
# Set it under GitHub → Settings → Secrets and variables → Actions.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-function.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ogsvchujqpayuckxuwdf
    steps:
      - uses: actions/checkout@v4

      - name: Check secret is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Add it in GitHub → Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy function
        run: supabase functions deploy hubspot --project-ref "$PROJECT_REF"

      - name: Smoke-test live endpoint
        run: |
          URL="https://${PROJECT_REF}.supabase.co/functions/v1/hubspot"
          ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nc3ZjaHVqcXBheXVja3h1d2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNzU3MzIsImV4cCI6MjA5NTk1MTczMn0.naUOzsjvZk5BT6kUM-eV1g4JxPhBogkBu8gb1Rg0Z8M"

          status=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "$URL" -H "apikey: $ANON")
          [ "$status" = "204" ] || { echo "::error::CORS preflight returned $status (expected 204)"; exit 1; }
          echo "CORS preflight OK (204)"

          # The function wraps errors as HTTP 200 with { error, status } in the
          # body (so supabase-js clients see the detail) — check the body.
          body=$(curl -s -X POST "$URL" \
            -H "Content-Type: application/json" -H "apikey: $ANON" \
            -d '{"action":"getTemplates"}')
          echo "$body" | grep -q '"status":401' || { echo "::error::Unauthenticated POST response: $body"; exit 1; }
          echo "Auth gate OK (401 error body without user session)"

          echo "Deploy verified — hubspot edge function is live."
