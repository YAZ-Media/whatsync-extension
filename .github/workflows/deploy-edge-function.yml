name: Deploy edge functions

# Deploys all WhatSync Supabase edge functions automatically whenever their
# source changes on main, then smoke-tests every live endpoint. Requires one
# repository secret:
#   SUPABASE_ACCESS_TOKEN  (Supabase Dashboard → Account → Access Tokens)
# Set it under GitHub → Settings → Secrets and variables → Actions.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'deploy-edge-function.sh'
      - '.github/workflows/deploy-edge-function.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ogsvchujqpayuckxuwdf
    steps:
      - uses: actions/checkout@v4

      - name: Check secret is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Add it in GitHub → Settings → Secrets and variables → Actions, then re-run this workflow. (Until then, deploys must be run manually — see DEPLOYMENT.md.)"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        # verify_jwt stays off (config.toml + flag): the functions authenticate
        # against the external auth project's JWTs themselves; platform
        # verification would reject every request at the gateway.
        run: |
          for fn in hubspot hubspot-oauth settings external-auth billing save-activity-config; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done

      - name: Smoke-test live endpoints
        run: bash deploy-edge-function.sh smoke
